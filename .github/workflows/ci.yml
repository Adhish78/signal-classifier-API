name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Lint with Ruff
      run: |
        ruff check --output-format=github .
        ruff format --check .

    - name: Type check with mypy
      run: |
        mypy api src

    - name: Model sanity check
      run: |
        PYTHONPATH=. python -c "from src.inference import InferenceEngine; import numpy as np; engine = InferenceEngine('tests/fixtures/test_model.onnx'); out = engine.predict(np.random.randn(1, 2, 128)); assert out.shape == (1, 11); print('Model sanity check passed successfully!')"

    - name: Run tests with pytest
      run: |
        PYTHONPATH=. python -m pytest

  docker-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker Image
      run: docker build -t signal-classifier-api:test .


