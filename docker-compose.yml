services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - SC_PORT=8000
      - SC_HOST=0.0.0.0
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    # Add .env support, but keep it optional in case it does not exist
    env_file:
      - .env
    depends_on:
      - mlflow
    volumes:
      - ./models:/app/models


  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.14.0
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    # Note: We use --serve-artifacts and --artifacts-destination to enable artifact proxying.
    # This allows host-side clients running outside the docker container to upload artifacts
    # (reports/plots) to the tracking server over HTTP, instead of trying to write directly
    # to the container's isolated local filesystem path.
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow/mlflow.db --artifacts-destination /mlflow/artifacts --serve-artifacts

volumes:
  mlflow_data:

